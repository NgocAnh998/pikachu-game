<!doctype html>

<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pikachu Game</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <button class="btn-level" id="level1">Màn 1</button>
    <button class="btn-level" id="level2">Màn 2</button>
    <button class="btn-level" id="level3">Màn 3</button>
    <button class="btn-level" id="level4">Màn 4</button>
    <button class="btn-level" id="level5">Màn 5</button>
    <button class="btn-level" id="level6">Màn 6</button>

    <h1 id="title">Pikachu Level 5</h1>

    <button id="btn-refresh">Xáo bài (Refresh)</button>

    <button id="btn-help">Trợ giúp</button>

    <h2 id="score">0</h2>
    <!-- <img class="boss" src="/assets/gif/giphy.gif" alt="" /> -->
    <div class="skills">
      <div id="ball" class="btn-skill"></div>
      <div id="fire" class="btn-skill"></div>
      <div id="water" class="btn-skill"></div>
      <div id="plant" class="btn-skill"></div>
      <div id="earth" class="btn-skill"></div>
    </div>

    <div id="game-board" class="special angel"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
